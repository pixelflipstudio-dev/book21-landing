<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A city skyline at night on one side and a cruise ship at sea on the other">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03140d"/>
      <stop offset="0.65" stop-color="#0b3a26"/>
      <stop offset="1" stop-color="#1c5a3d"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2f20"/>
      <stop offset="1" stop-color="#01120b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fcd34d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="640" height="400" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="640" height="400" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#f5f0e1" opacity="0.7">
      <circle cx="60" cy="40" r="1.4"/><circle cx="130" cy="78" r="1"/><circle cx="210" cy="30" r="1.6"/>
      <circle cx="300" cy="62" r="1"/><circle cx="380" cy="26" r="1.3"/><circle cx="450" cy="70" r="1"/>
      <circle cx="530" cy="36" r="1.5"/><circle cx="600" cy="84" r="1"/><circle cx="250" cy="110" r="0.9"/>
    </g>
    <!-- moon -->
    <circle cx="560" cy="70" r="26" fill="#f5f0e1"/>
    <circle cx="571" cy="62" r="24" fill="#072418"/>

    <!-- the strip: left half -->
    <ellipse cx="170" cy="240" rx="190" ry="90" fill="url(#glow)"/>
    <g fill="#04170f">
      <rect x="20" y="200" width="36" height="140"/>
      <rect x="62" y="170" width="44" height="170"/>
      <!-- tower -->
      <rect x="132" y="120" width="8" height="220"/>
      <path d="M118 128h36l-6-14h-24z"/>
      <rect x="133" y="92" width="6" height="24"/>
      <rect x="160" y="190" width="54" height="150"/>
      <!-- pyramid -->
      <path d="M220 340 270 248 320 340z"/>
      <rect x="326" y="214" width="30" height="126"/>
    </g>
    <!-- lit windows -->
    <g fill="#fcd34d" opacity="0.85">
      <rect x="27" y="214" width="6" height="4"/><rect x="41" y="232" width="6" height="4"/><rect x="27" y="262" width="6" height="4"/>
      <rect x="70" y="186" width="6" height="4"/><rect x="88" y="204" width="6" height="4"/><rect x="70" y="236" width="6" height="4"/><rect x="88" y="268" width="6" height="4"/>
      <rect x="168" y="206" width="6" height="4"/><rect x="186" y="224" width="6" height="4"/><rect x="200" y="252" width="6" height="4"/><rect x="168" y="280" width="6" height="4"/>
      <rect x="334" y="232" width="6" height="4"/><rect x="334" y="262" width="6" height="4"/>
    </g>
    <circle cx="136" cy="90" r="4" fill="#f87171"/>
    <path d="M270 248v-120" stroke="#fcd34d" stroke-opacity="0.35" stroke-width="6"/>
    <!-- marquee sign: a card -->
    <g transform="translate(232 150) rotate(-8)">
      <rect width="40" height="56" rx="5" fill="#fcfbf7" stroke="#e5e0d8"/>
      <path transform="translate(8 12) scale(1)" d="M12 21.5S3 15.8 3 9.6C3 6.5 5.4 4 8.3 4c1.6 0 3 .8 3.7 2.1C12.7 4.8 14.1 4 15.7 4 18.6 4 21 6.5 21 9.6c0 6.2-9 11.9-9 11.9z" fill="#c5221f"/>
    </g>

    <!-- sea: right half -->
    <rect x="360" y="300" width="280" height="100" fill="url(#sea)"/>
    <rect y="340" width="360" height="60" fill="#02140c"/>
    <g stroke="#6ee7b7" stroke-opacity="0.25" stroke-width="2" fill="none">
      <path d="M380 330q15-6 30 0t30 0 30 0"/>
      <path d="M500 352q15-6 30 0t30 0 30 0"/>
      <path d="M420 376q15-6 30 0t30 0"/>
    </g>
    <!-- ship -->
    <g>
      <path d="M396 300h214l-22 34H420z" fill="#f5f0e1"/>
      <rect x="420" y="278" width="168" height="22" rx="3" fill="#e9e4d6"/>
      <rect x="440" y="258" width="128" height="20" rx="3" fill="#dcd5c3"/>
      <rect x="462" y="240" width="84" height="18" rx="3" fill="#cfc7b2"/>
      <path d="M520 240v-26h20l4 26z" fill="#c5221f"/>
      <rect x="520" y="214" width="24" height="5" fill="#01120b"/>
      <path d="M396 300h214l-4 6H400z" fill="#c5221f"/>
      <g fill="#fcd34d">
        <rect x="430" y="285" width="8" height="5" rx="1"/><rect x="446" y="285" width="8" height="5" rx="1"/><rect x="462" y="285" width="8" height="5" rx="1"/>
        <rect x="478" y="285" width="8" height="5" rx="1"/><rect x="494" y="285" width="8" height="5" rx="1"/><rect x="510" y="285" width="8" height="5" rx="1"/>
        <rect x="526" y="285" width="8" height="5" rx="1"/><rect x="542" y="285" width="8" height="5" rx="1"/><rect x="558" y="285" width="8" height="5" rx="1"/><rect x="574" y="285" width="8" height="5" rx="1"/>
        <rect x="452" y="265" width="8" height="5" rx="1"/><rect x="470" y="265" width="8" height="5" rx="1"/><rect x="488" y="265" width="8" height="5" rx="1"/>
        <rect x="506" y="265" width="8" height="5" rx="1"/><rect x="524" y="265" width="8" height="5" rx="1"/><rect x="542" y="265" width="8" height="5" rx="1"/>
      </g>
      <path d="M430 334h150" stroke="#fcd34d" stroke-opacity="0.25" stroke-width="3"/>
    </g>
    <!-- a dotted route joining the two -->
    <path d="M300 150 C 360 90, 430 110, 500 200" fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle cx="500" cy="200" r="5" fill="#fcd34d"/>
  </g>
</svg>
